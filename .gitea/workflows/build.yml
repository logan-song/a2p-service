name: Build and Upload

on:
  push:
    branches:
      - main

jobs:
  build-main:
    if: github.ref == 'refs/heads/main'
    runs-on: staging-server

    steps:
      - name: Deploy Main
        run: |
          cd ${{ secrets.REPOSITORY_PATH }}
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          bash ./deploy/deploy_internal.sh branch=main
